<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#071016" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Jewel Cascade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/game.css" />
    <script src="p5.min.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand-row">
          <div class="brand">Jewel Cascade</div>
          <button id="btn-mute" class="icon-btn" type="button" aria-pressed="false">
            Sound On
          </button>
        </div>
        <div class="hud" aria-live="polite">
          <div class="stat">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Moves</span>
            <span class="stat-value" id="moves-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="best-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Combo</span>
            <span class="stat-value" id="combo-value">—</span>
          </div>
        </div>
      </header>

      <section class="board-wrap" aria-label="Game board">
        <div id="board-host"></div>
        <div id="mode-hint" class="mode-hint" role="status"></div>
      </section>

      <footer class="toolbar">
        <div class="boosters">
          <button id="btn-hammer" class="tool-btn" type="button" disabled>
            <span>Hammer</span>
            <span class="tool-count" id="count-hammer">0</span>
          </button>
          <button id="btn-scramble" class="tool-btn" type="button" disabled>
            <span>Scramble</span>
            <span class="tool-count" id="count-scramble">0</span>
          </button>
          <button id="btn-cycle" class="tool-btn" type="button" disabled>
            <span>Cycle</span>
            <span class="tool-count" id="count-cycle">0</span>
          </button>
        </div>
        <div class="actions">
          <button id="btn-hint" class="action-btn" type="button">Hint</button>
          <button id="btn-rotate-l" class="action-btn" type="button">⟲ Left</button>
          <button id="btn-rotate-r" class="action-btn" type="button">Right ⟳</button>
          <button id="btn-restart" class="action-btn danger" type="button">Restart</button>
          <button id="btn-cancel" class="action-btn cancel" type="button">Cancel booster</button>
        </div>
        <p class="hint-line">Swipe gems to swap · Match 4 for rockets · Match 5 for bombs</p>
      </footer>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-card">
        <h1>Jewel Cascade</h1>
        <p>
          Swipe to swap. Chain cascades for combos. Match four for a rocket, five for a bomb.
          Built for phones — play with your thumbs.
        </p>
        <button id="btn-play" class="primary" type="button">Play</button>
      </div>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2>No moves left</h2>
        <div class="over-stats">
          <div>
            <span>Score</span>
            <strong id="over-score">0</strong>
          </div>
          <div>
            <span>Best</span>
            <strong id="over-best">0</strong>
          </div>
        </div>
        <button id="btn-again" class="primary" type="button">Play again</button>
      </div>
    </div>

    <noscript>
      <p class="noscript">JavaScript is required to play Jewel Cascade.</p>
    </noscript>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
